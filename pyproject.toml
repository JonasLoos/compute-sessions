[project]
name = "compute-sessions"
version = "0.5.0"
description = "Interactive compute sessions on your SLURM cluster — the cs CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.urls]
Repository = "https://github.com/JonasLoos/compute-sessions"

[project.scripts]
cs = "compute_sessions.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

# Without these, `uv tool install --force --from .` reuses the cached wheel unless pyproject.toml itself changed — edits to the package, the runner, or the skills were silently not installed (the "installed build differs from its source repo" warning then fires on every command until someone adds --reinstall).
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "remote/**" }, { file = "skills/**" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# explicit list because hatchling's default walk follows the .claude/skills symlink and then drops the real skills/ dir as an already-visited duplicate, breaking the wheel's force-include of skills/ when building from the sdist
[tool.hatch.build.targets.sdist]
only-include = ["src", "skills", "remote", "examples", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/compute_sessions"]

# Source-side files and agent skills ship inside the wheel so installs need no repo checkout: `cs assets` points at the remote files, `cs install-skills` copies the skills out.
[tool.hatch.build.targets.wheel.force-include]
"remote" = "compute_sessions/assets/remote"
"skills" = "compute_sessions/assets/skills"
