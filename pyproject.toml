[project]
name = "compute-sessions"
version = "0.4.1"
description = "Interactive compute sessions on your own compute sources (SLURM clusters, Docker hosts, vast.ai) — the cs CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.urls]
Repository = "https://github.com/JonasLoos/compute-sessions"

[project.scripts]
cs = "compute_sessions.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_sessions"]

# Source-side files and agent skills ship inside the wheel so installs need no repo checkout: `cs assets` points at the remote files, `cs install-skills` copies the skills out.
[tool.hatch.build.targets.wheel.force-include]
"remote" = "compute_sessions/assets/remote"
".claude/skills" = "compute_sessions/assets/skills"
