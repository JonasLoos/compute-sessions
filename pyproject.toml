[project]
name = "compute-sessions"
version = "0.3.3"
description = "Interactive compute sessions on your own compute sources (SLURM clusters, Docker hosts, vast.ai) — the cs CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.urls]
Repository = "https://github.com/JonasLoos/compute-sessions"

[project.scripts]
cs = "compute_sessions.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_sessions"]
