# Annotated example config for compute-sessions.
# Lives at ~/.config/compute-sessions/config.toml (override the path with the COMPUTE_SESSIONS_CONFIG env var).

host = "mycluster"               # ssh alias of the login node (connection details live in ~/.ssh/config); also prefixes session ids
image = "images/default.sif"     # Apptainer image, relative to remote_base
partitions = ["cpu-2h", "gpu-2h", "gpu-test"]
default_partition = "gpu-2h"
gpu_types = ["h100", "80gb", "40gb"]   # sbatch --constraint values
default_mem = 42                 # GB
max_sessions_per_repo = 3        # active+pending cap per repo; 0 = unlimited
# exclude_nodes = ["node042"]    # skip specific nodes, e.g. while one is broken
# login_host = "mycluster"       # login-node alias as seen from compute nodes, if different
# remote_base = "~/.compute-sessions"
# container_user = ""            # in-container login; empty = remote whoami
# control_path = "~/.ssh/cm-%r@%h:%p"   # OpenSSH ControlMaster socket template
